name: Tag and publish to NuGet

on:
    workflow_dispatch:
        inputs:
            version:
                description: 'Version to release, e.g. 2.3.0. Needs a draft release and an open milestone with this name'
                required: true
            dry_run:
                description: 'Stop before pushing: nothing is pushed, tagged or published'
                type: boolean
                required: true
                default: true

permissions:
  contents: write
  issues: write
  id-token: write

env:
  GH_REPO: ${{ github.repository }}
  RELEASE_VERSION: ${{ inputs.version }}
  RELEASE_URL: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ inputs.version }}

jobs:
  publish-to-nuget:
    runs-on: ubuntu-latest
    
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server
        env:
          SA_PASSWORD: "AMoreComplexPsw123!"
          ACCEPT_EULA: "Y"
        ports:
          - 1433:1433
        options: >-
          --health-cmd "exit 0"
          --health-interval 10s
          --health-timeout 30s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check release preconditions
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [[ ! "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version '$RELEASE_VERSION' is not in major.minor.patch form"
            exit 1
          fi

          failures=0
          reject() {
            if [ "$DRY_RUN" = "true" ]; then
              echo "::warning::$1"
            else
              echo "::error::$1"
              failures=1
            fi
          }

          is_draft=$(gh release view "$RELEASE_VERSION" --json isDraft --jq .isDraft 2>/dev/null || true)
          [ "$is_draft" = "true" ] || reject "No draft release for $RELEASE_VERSION"

          open_issues=$(gh api "repos/$GITHUB_REPOSITORY/milestones?state=open&per_page=100" \
            --jq "map(select(.title == \"$RELEASE_VERSION\")) | first | .open_issues // \"no milestone\"")
          [ "$open_issues" = "0" ] || reject "Milestone $RELEASE_VERSION is not ready, open issues: $open_issues"

          if [ "$GITHUB_RUN_ATTEMPT" = "1" ]; then
            for package in asurebus.abstractions asurebus; do
              if curl -fsS "https://api.nuget.org/v3-flatcontainer/$package/index.json" \
                | jq -e --arg version "$RELEASE_VERSION" 'any(.versions[]; . == $version)' >/dev/null; then
                reject "$package $RELEASE_VERSION is already on NuGet: re-run the failed run, a new dispatch could tag a different commit"
              fi
            done
          fi

          exit "$failures"

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore dependencies
        run: dotnet restore

      - name: Build solution
        run: dotnet build --configuration Release --no-restore

      - name: Run tests
        env:
          ConnectionStrings__DefaultConnection: "Server=localhost,1433;Database=master;User Id=sa;Password=AMoreComplexPsw123!;Trusted_Connection=False;MultipleActiveResultSets=true;TrustServerCertificate=True;"
          ServiceBusConnectionString: ${{ secrets.INTEGRATION_TESTS_SERVICE_BUS_CONNECTION_STRING }}
          AutomapperLicense: ${{ secrets.INTEGRATION_TESTS_AUTOMAPPER_LICENSE }}
          StorageAccountConnectionString: ${{ secrets.INTEGRATION_TESTS_STORAGE_ACCOUNT_CONNECTION_STRING }}
        run: dotnet test --configuration Release --no-build --verbosity normal

      - name: Pack ASureBus.Abstractions
        run: dotnet pack ASureBus.Abstractions/ASureBus.Abstractions.csproj --configuration Release --output ./artifacts /p:Version=$RELEASE_VERSION /p:PackageReleaseNotes=$RELEASE_URL

      - name: Pack ASureBus
        run: dotnet pack ASureBus/ASureBus.csproj --configuration Release --output ./artifacts /p:Version=$RELEASE_VERSION /p:PackageReleaseNotes=$RELEASE_URL

      - name: Upload packages for inspection
        if: ${{ inputs.dry_run }}
        uses: actions/upload-artifact@v4
        with:
          name: packages
          path: ./artifacts/*.nupkg

      - name: Verify Trusted Publishing and get a NuGet API key
        id: login
        uses: NuGet/login@v1
        with:
          user: red.Co

      - name: Push ASureBus.Abstractions to NuGet
        if: ${{ !inputs.dry_run }}
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: dotnet nuget push ./artifacts/ASureBus.Abstractions.*.nupkg --api-key $NUGET_API_KEY --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Push ASureBus to NuGet
        if: ${{ !inputs.dry_run }}
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: dotnet nuget push ./artifacts/ASureBus.*.nupkg --api-key $NUGET_API_KEY --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Publish GitHub Release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$RELEASE_VERSION" --draft=false --latest --target "$GITHUB_SHA"

  close-milestone:
    needs: publish-to-nuget
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Comment on the released issues
        run: |
          for issue in $(gh issue list --milestone "$RELEASE_VERSION" --state closed --limit 200 --json number --jq '.[].number'); do
            gh issue comment "$issue" --body "Released in [$RELEASE_VERSION]($RELEASE_URL)."
          done

      - name: Close the milestone
        run: |
          milestone=$(gh api "repos/$GITHUB_REPOSITORY/milestones?state=open&per_page=100" \
            --jq "map(select(.title == \"$RELEASE_VERSION\")) | first | .number")
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/milestones/$milestone" -f state=closed --silent
